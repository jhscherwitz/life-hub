name: Build installers

# Push a version tag (for example v0.2.0) to build the Windows and Mac installers
# and attach them to a draft GitHub Release. Nothing is public until the draft is published.
# Pull requests that touch packaging build the installers too, without releasing them.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - 'electron/updater.ts'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Use 'npm version' to bump both."
            exit 1
          fi

      - run: npm run build

      - run: npm test

      - name: Build installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then publish=always; else publish=never; fi
          npx electron-builder ${{ matrix.platform }} --publish "$publish"

      - name: Keep the installers on this run
        uses: actions/upload-artifact@v4
        with:
          name: hub-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
